name: Superhuman Docs Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  superhuman-docs-tests:
    name: Mock and real Superhuman Docs API tests
    runs-on: ubuntu-latest
    env:
      SUPERHUMAN_DOCS_TEST_API_TOKEN: ${{ secrets.CODA_TEST_API_TOKEN }}
      SUPERHUMAN_DOCS_TEST_DOC_ID: ${{ secrets.CODA_TEST_DOC_ID }}
      USE_MERGED_VCPKG_MANIFEST: "1"
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      GEN: ninja
    steps:
      - uses: actions/checkout@v4

      - name: Initialize native build submodules
        run: git submodule update --init --recursive -- duckdb extension-ci-tools

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up VCPKG
        run: |
          make setup-vcpkg
          if [ "$(git -C vcpkg rev-parse --is-shallow-repository)" = "true" ]; then
            git -C vcpkg fetch --unshallow --tags
          fi

      - name: Check Superhuman Docs test secrets
        run: |
          test -n "$SUPERHUMAN_DOCS_TEST_API_TOKEN"
          test -n "$SUPERHUMAN_DOCS_TEST_DOC_ID"

      - name: Run cargo fmt check
        run: cargo fmt --check

      - name: Run mocked Superhuman Docs API tests
        run: cargo test

      - name: Run real Superhuman Docs API tests
        run: make test_superhuman_docs_http_real
